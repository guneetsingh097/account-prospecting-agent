name: "🧠 Migraine Alerts — Setup on Mac mini"

on:
  workflow_dispatch:
    inputs:
      city:
        description: "City name for weather data (e.g. London, Toronto)"
        required: true
        default: "London"
      ntfy_topic:
        description: "ntfy.sh topic for iPhone push notifications (e.g. migraine-alerts-abc123)"
        required: false
        default: ""
      send_test:
        description: "Send a test notification immediately after setup?"
        required: false
        type: boolean
        default: true

jobs:
  setup:
    name: Install launchd agent on Mac mini
    runs-on: self-hosted   # ← runs on your Mac mini, not GitHub's servers

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Find Python 3
        id: python
        run: |
          for p in /opt/homebrew/bin/python3 /usr/local/bin/python3 /usr/bin/python3; do
            if [[ -x "$p" ]]; then echo "path=$p" >> $GITHUB_OUTPUT && break; fi
          done
          if [[ -z "${{ steps.python.outputs.path }}" ]]; then
            echo "::error::Python 3 not found. Install via: brew install python3"
            exit 1
          fi
          echo "Python: $(${{ steps.python.outputs.path }} --version)"

      - name: Install requests if needed
        run: |
          ${{ steps.python.outputs.path }} -c "import requests" 2>/dev/null || \
            ${{ steps.python.outputs.path }} -m pip install requests --quiet

      - name: Install launchd agent
        env:
          MIGRAINE_CITY: ${{ inputs.city }}
          MIGRAINE_NTFY_TOPIC: ${{ inputs.ntfy_topic }}
        run: bash setup_alerts_mac.sh "$MIGRAINE_CITY" "$MIGRAINE_NTFY_TOPIC"

      - name: Send test notification
        if: ${{ inputs.send_test }}
        env:
          MIGRAINE_CITY: ${{ inputs.city }}
          MIGRAINE_NTFY_TOPIC: ${{ inputs.ntfy_topic }}
        run: ${{ steps.python.outputs.path }} migraine_alert.py --test

      - name: Show status
        run: |
          echo ""
          echo "✓ launchd agent installed and running"
          echo "✓ Checks every 6 hours for: ${{ inputs.city }}"
          if [[ -n "${{ inputs.ntfy_topic }}" ]]; then
            echo "✓ iPhone push → ntfy.sh/${{ inputs.ntfy_topic }}"
          fi
          echo ""
          echo "Log file: ~/Library/Logs/migraine_tracker.log"
          echo "State file: ~/Library/Application Support/MigraineTracker/state.json"
